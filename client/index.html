<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crucible</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #0d0d0d; font-family: 'Segoe UI', system-ui, sans-serif; color: #f0e8d8; }
      canvas { display: block; }
      #error-overlay { position: fixed; top: 0; left: 0; right: 0; background: rgba(200, 0, 0, 0.9); color: white; padding: 10px; z-index: 9999; font-family: monospace; white-space: pre-wrap; font-size: 14px; pointer-events: none; }
    </style>
    <script>
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        var el = document.getElementById('error-overlay');
        if (!el) { el = document.createElement('div'); el.id = 'error-overlay'; document.body.appendChild(el); }
        el.innerText +=  msg + '\nURL: ' + url + '\nLine: ' + lineNo + '\nCol: ' + columnNo + '\nStack: ' + (error ? error.stack : '') + '\n\n';
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.getElementById('error-overlay');
        if (!el) { el = document.createElement('div'); el.id = 'error-overlay'; document.body.appendChild(el); }
        el.innerText += 'Unhandled Rejection: ' + (event.reason ? (event.reason.stack || event.reason) : event) + '\n\n';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
